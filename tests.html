<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gather stay booking tests</title>
    <style>
      body { max-width: 760px; margin: 50px auto; padding: 0 20px; color: #1d3129; background: #f5f7f5; font: 14px/1.5 "Segoe UI", sans-serif; }
      h1 { font: 500 34px Georgia, serif; } #results { padding: 0; list-style: none; }
      li { margin: 8px 0; padding: 12px 14px; background: #fff; border-left: 4px solid #245c47; }
      li.fail { border-color: #a34738; color: #a34738; } #summary { margin-top: 22px; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Stay booking checks</h1>
    <p>Focused browser-native tests for booking rules and requests, the Gather assistant, shared listings and photo uploads, EmailJS notifications, and the Philippines map asset.</p>
    <ol id="results"></ol>
    <p id="summary" role="status"></p>
    <script src="booking.js"></script>
    <script src="email-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="supabase-data.js"></script>
    <script src="assistant-engine.js"></script>
    <script>
      (function () {
        const api = window.GatherBooking;
        const output = document.getElementById("results");
        let passed = 0;
        let failed = 0;
        function test(name, fn) {
          const item = document.createElement("li");
          try {
            fn();
            passed += 1;
            item.textContent = `PASS — ${name}`;
          } catch (error) {
            failed += 1;
            item.className = "fail";
            item.textContent = `FAIL — ${name}: ${error.message}`;
          }
          output.appendChild(item);
        }
        async function testAsync(name, fn) {
          const item = document.createElement("li");
          try {
            await fn();
            passed += 1;
            item.textContent = `PASS — ${name}`;
          } catch (error) {
            failed += 1;
            item.className = "fail";
            item.textContent = `FAIL — ${name}: ${error.message}`;
          }
          output.appendChild(item);
        }
        function assert(condition, message) {
          if (!condition) throw new Error(message || "Assertion failed");
        }
        function throws(fn, phrase) {
          let thrown = false;
          try { fn(); } catch (error) { thrown = error.message.includes(phrase); }
          assert(thrown, `Expected error containing "${phrase}"`);
        }
        const state = api.createInitialState();
        const casa = state.offerings.find((item) => item.id === "isla-norte");
        const now = new Date(2030, 0, 6, 12, 0);
        const checkin = "2030-01-07";
        const checkout = "2030-01-10";

        test("calculates local-calendar nights across month boundaries", function () {
          assert(api.getNights("2030-01-30", "2030-02-02") === 3, "Should count three nights");
          assert(api.getNights("2030-02-02", "2030-01-30") === 0, "Checkout cannot precede check-in");
        });
        test("accepts custom search guest counts from 9 through 20", function () {
          assert(api.getSearchGuestCount("8") === 8, "Should preserve standard guest choices");
          assert(api.getSearchGuestCount("custom", "12") === 12, "Should return the requested custom count");
          throws(() => api.getSearchGuestCount("custom", "21"), "between 1 and 20");
          throws(() => api.getSearchGuestCount("custom", "8"), "between 1 and 20");
        });
        test("trims and validates presentation guest names", function () {
          assert(api.validateGuestName("  Jamie Lee  ") === "Jamie Lee", "Guest names should be trimmed before saving");
          throws(() => api.validateGuestName(" "), "between 2 and 80");
          throws(() => api.validateGuestName("x".repeat(81)), "between 2 and 80");
        });
        test("starts with real Philippine property listings and indicative PHP prices", function () {
          assert(state.offerings.length >= 25, "Should include at least 25 property listings");
          assert(new Set(state.offerings.map((offering) => offering.id)).size === state.offerings.length, "Every property should have a unique ID");
          assert(new Set(state.offerings.map((offering) => offering.name)).size === state.offerings.length, "Every property should have a unique name");
          assert(state.offerings.every((offering) => offering.rating >= 1 && offering.rating <= 5), "Sample stay ratings should use a five-point scale");
          assert(state.offerings.every((offering) => /Philippines|Siargao|Baguio|Bohol|Palawan|Coron/.test(offering.location)), "Sample stays should be in the Philippines");
          assert(state.offerings.every((offering) => offering.price >= 1000), "Nightly prices should use realistic PHP amounts");
          assert(["City hotels", "Beach resorts", "Mountain hotels", "Heritage hotels"].every((category) => state.offerings.some((offering) => offering.category === category)), "Listings should include varied Philippine property categories");
          assert(state.offerings.some((offering) => offering.name === "The Peninsula Manila") && state.offerings.some((offering) => offering.name === "Hotel Luna"), "The listings should use real Philippine property names");
          assert(state.offerings.every((offering) =>
            Number.isFinite(offering.latitude) && offering.latitude >= 4 && offering.latitude <= 22 &&
            Number.isFinite(offering.longitude) && offering.longitude >= 115 && offering.longitude <= 128
          ), "Every sample stay should have map coordinates in the Philippines");
        });
        test("uses locally stored destination photos and upgrades cached sample images", function () {
          assert(api.DEFAULT_OFFERINGS.every((offering) => /^assets\/stays\/[a-z0-9-]+\.jpg$/.test(offering.image)), "Every starter stay should use a local destination photo");
          assert(api.DEFAULT_OFFERINGS.find((offering) => offering.name === "The Peninsula Manila").image === "assets/stays/peninsula-manila.jpg", "The Peninsula listing should use its property photo");
          assert(api.DEFAULT_OFFERINGS.find((offering) => offering.name === "Hotel Luna").image === "assets/stays/hotel-luna-vigan.jpg", "Hotel Luna should use its property photo");
          assert(api.DEFAULT_OFFERINGS.find((offering) => offering.name === "Taal Vista Hotel").image === "assets/stays/taal-vista-hotel.jpg", "Taal Vista should use its property photo");
          const cached = api.withDefaultOfferings([{ ...state.offerings[0], image: "photo-1510414842594-a61c69b5ae57" }]);
          assert(cached.find((offering) => offering.id === "isla-norte").image === "assets/stays/siargao-cloud9.jpg", "Old cached sample photos should migrate to the destination image");
          const hostListing = api.withDefaultOfferings([{ id: "host-place", name: "Host place", image: "https://example.test/host-photo.jpg", days: [], amenities: [] }]);
          assert(hostListing.find((offering) => offering.id === "host-place").image === "https://example.test/host-photo.jpg", "Host-uploaded photos should remain unchanged");
        });
        test("adds new sample stays to saved inventory without replacing host listings", function () {
          const saved = state.offerings.slice(0, 4).map((offering) => ({ ...offering, price: offering.price + 100 }));
          saved.push({ id: "host-place", name: "Host place", category: "Guest houses", location: "Cebu City, Philippines", price: 3000, days: [0, 1, 2, 3, 4, 5, 6], amenities: [] });
          const merged = api.withDefaultOfferings(saved);
          assert(merged.length === api.DEFAULT_OFFERINGS.length + 1, "Should add missing defaults while preserving the saved host listing");
          assert(merged.find((offering) => offering.id === "isla-norte").price === saved[0].price, "Should preserve saved edits to existing stays");
          assert(Number.isFinite(merged.find((offering) => offering.id === "isla-norte").latitude), "Should add map coordinates to existing saved stays");
          assert(merged.some((offering) => offering.id === "host-place"), "Should preserve host-created listings");
        });
        test("converts saved ten-point ratings to the five-point scale", function () {
          const migrated = api.withDefaultOfferings([{ id: "host-place", name: "Host place", rating: 9.2, days: [], amenities: [] }]);
          assert(migrated.find((offering) => offering.id === "host-place").rating === 4.6, "Legacy host rating should be halved");
        });
        test("allows an available stay with the right capacity and minimum nights", function () {
          assert(api.isAvailable(casa, checkin, checkout, [], 2, now), "Three-night stay should be bookable");
          assert(!api.isAvailable({ ...casa, minimumNights: 2 }, checkin, "2030-01-08", [], 2, now), "A minimum-stay rule should be enforced");
          assert(!api.isAvailable(casa, checkin, checkout, [], 3, now), "The listing currently allows up to two guests");
        });
        test("rejects stays in the past and unavailable check-in days", function () {
          const weekdayOnly = { ...casa, days: [1] };
          assert(!api.isAvailable(casa, "2030-01-05", "2030-01-07", [], 1, now), "Past check-ins should be unavailable");
          assert(!api.isAvailable(weekdayOnly, "2030-01-08", "2030-01-10", [], 1, now), "Tuesday check-in should be unavailable");
        });
        test("blocks overlapping nights but leaves back-to-back checkout available", function () {
          const reserved = [{ offeringId: casa.id, checkin: "2030-01-07", checkout: "2030-01-10", status: "confirmed" }];
          assert(!api.isAvailable(casa, "2030-01-09", "2030-01-12", reserved, 1, now), "Overlapping nights should be blocked");
          assert(api.isAvailable(casa, "2030-01-10", "2030-01-12", reserved, 1, now), "A same-day checkout/check-in is valid");
          assert(api.isAvailable(casa, "2030-01-09", "2030-01-12", [{ ...reserved[0], status: "cancelled" }], 1, now), "Cancelled trips should release the dates");
          assert(api.isAvailable(casa, "2030-01-09", "2030-01-12", [{ ...reserved[0], status: "pending" }], 1, now), "Pending requests should not reserve dates");
        });
        test("creates a reservation with the correct nightly total and guest count", function () {
          const bookingState = api.createInitialState();
          bookingState.offerings.find((offering) => offering.id === casa.id).ownerId = "host-123";
          const booking = api.createBooking(bookingState, { offeringId: casa.id, checkin, checkout, guests: 2, name: "Jamie Lee", email: "jamie@example.com", accountId: "guest-123", notes: "First visit" }, now);
          assert(booking.nights === 3 && booking.total === casa.price * 3, "Total should be nightly price times nights");
          assert(booking.guests === 2 && booking.status === "pending" && booking.notes === "First visit", "Guest count and pending request status should be recorded");
          assert(booking.accountId === "guest-123", "The trip should belong to the signed-in guest");
          assert(booking.hostId === "host-123", "The reservation should be linked to the listing host");
          assert(bookingState.bookings.length === 1, "The booking request should be saved in the booking state");
        });
        test("rejects conflicts, invalid contact details, and invalid stay dates", function () {
          const bookingState = api.createInitialState();
          api.createBooking(bookingState, { offeringId: casa.id, checkin, checkout, guests: 2, name: "Jamie Lee", email: "jamie@example.com" }, now);
          bookingState.bookings[0].status = "confirmed";
          throws(() => api.createBooking(bookingState, { offeringId: casa.id, checkin: "2030-01-09", checkout: "2030-01-12", guests: 1, name: "Alex Doe", email: "alex@example.com" }, now), "not available");
          throws(() => api.createBooking(api.createInitialState(), { offeringId: casa.id, checkin, checkout, guests: 2, name: "Alex Doe", email: "not-an-email" }, now), "valid email");
          throws(() => api.createBooking(api.createInitialState(), { offeringId: casa.id, checkin: "2030-01-05", checkout, guests: 2, name: "Alex Doe", email: "alex@example.com" }, now), "future");
        });
        async function finish() {
          await testAsync("provides a private Gather-specific booking and listing assistant", async function () {
            const response = await fetch("./index.html");
            const markup = await response.text();
            const appScript = await (await fetch("./app.js")).text();
            const styles = await (await fetch("./styles.css")).text();
            const chatScript = await (await fetch("./chat.js")).text();
            const schema = await (await fetch("./supabase-schema.sql")).text();
            const engineResponse = await fetch("./assistant-engine.js");
            assert(markup.includes('id="trip-chat-form"') && markup.includes('id="trip-chat-messages"') && markup.includes("property listing"), "One assistant should support both booking help and property listing");
            assert(markup.includes('data-trip-prompt=') && chatScript.includes('event.key === "Enter"'), "The chat should offer quick prompts and Enter-to-send keyboard interaction");
            assert(engineResponse.ok && markup.includes('src="assistant-engine.js"'), "The purpose-built assistant engine should be included in the website");
            const functionResponse = await fetch("./supabase/functions/gather-chat/index.ts");
            const functionSource = await functionResponse.text();
            const functionConfig = await (await fetch("./supabase/config.toml")).text();
            const dataScript = await (await fetch("./supabase-data.js")).text();
            assert(markup.includes('id="floating-chat-launcher"') && markup.includes('aria-expanded="false" aria-controls="trip-chat-panel"') && markup.includes('id="trip-chat-panel"') && markup.includes('id="chat-panel-close"'), "The trip assistant should open from a closed floating launcher on every page");
            assert(styles.includes(".floating-chat-widget { z-index: 45; position: fixed;") && appScript.includes('event.key === "Escape"') && appScript.includes('nav.dataset.openChat === "true"'), "The floating chat should have keyboard dismissal and launcher controls");
            assert(chatScript.includes("GatherSupabase.chatAssistant") && chatScript.includes("GatherAssistant.startBooking"), "Chat should use a generative assistant and retain Gather’s booking safeguards");
            assert(functionResponse.ok && functionSource.includes("GATHER_AI_BASE_URL") && functionSource.includes("GATHER_AI_API_KEY") && functionSource.includes("GATHER_AI_MODEL"), "The secure server function should accept an OpenAI-compatible provider configured via server secrets");
            assert(functionSource.includes('timeZone: "Asia/Manila"') && functionSource.includes("currentPhilippineDateTime"), "The AI prompt should provide the current Philippines date and time instead of relying on the model to guess");
            assert(functionConfig.includes("[functions.gather-chat]") && functionConfig.includes("verify_jwt = true"), "The AI proxy should require an authenticated Gather session");
            assert(dataScript.includes("functions/v1/gather-chat") && !markup.includes("GATHER_AI_API_KEY"), "The AI provider secret must stay on the server and never appear in the website");
            assert(appScript.includes("window.GatherChatListingDraft") && appScript.includes("window.GatherChatBookingPreferences") && appScript.includes("GatherChatActions"), "Assistant actions should connect to Gather’s booking and editable listing flows");
            assert(styles.includes(".trip-chat {") && styles.includes(".trip-chat-form { grid-template-columns: 1fr; }"), "The assistant should remain usable on mobile-sized screens");
            assert(!markup.includes('id="guide-view"') && !markup.includes('class="feature-guide-trigger"') && !markup.includes("guide-script-list") && !markup.includes(">Tour</button>"), "The Tour entry and presenter-notes list should be removed");
            assert(styles.includes("grid-template-columns: minmax(235px, 34%) minmax(0, 1fr)") && styles.includes("--green: #28796b") && styles.includes("--sans:"), "Search list cards should use a wider photo column within the refreshed style system");
            assert(markup.includes('id="welcome-gate"') && markup.includes('id="welcome-dismiss"') && markup.includes("A booking request is not a confirmed reservation") && !markup.includes("id=\"welcome-continue-session\""), "The entry disclaimer should explain pending requests without forcing sign-in");
            assert(markup.includes('id="category-filters"') && markup.includes('class="stay-filter-sidebar"') && markup.includes('id="max-price-filter"') && markup.includes('id="min-rating-filter"'), "Find stays should keep categories and key filters in a dedicated left sidebar");
            assert(markup.includes('id="sort-select"') && markup.includes('id="results-view-toggle"') && markup.includes('data-view-mode="list"') && markup.includes('data-view-mode="grid"'), "Search results should offer accessible sort and list or grid controls");
            assert(markup.includes('id="map-preview-slot"') && markup.includes('id="expanded-map-column"') && appScript.includes('mapColumn.append(mapSection)'), "Opening the map should expand into a split view while retaining filters and results");
            assert(styles.includes(".map-preview-slot .map-attribution { display: none; }"), "Keep detailed boundary credits out of the compact map preview");
            assert(markup.includes("Request to book") || appScript.includes("Request to book"), "Guests should see a sign-in-gated request-to-book flow");
            assert(appScript.includes('if (!currentUser || currentUser.isAnonymous)') && appScript.includes('openAuthModal("signup", "guest", { type: "booking", offeringId })'), "An account should be required only when a guest starts a booking request");
            assert(styles.includes(".stay-filter-sidebar .category-row { flex-direction: column;") && styles.includes(".stay-filter-sidebar { position: static; width: 100%; max-width: 100%;") && styles.includes(".stay-results-layout { height: auto; min-height: 0; display: flex; flex-direction: column;") && styles.includes(".offering-card.scroll-reveal"), "Categories should stack on the left, fit mobile viewports, and listings should animate into view");
            assert(appScript.includes("maxZoom: expanded ? 6 : 5") && appScript.includes("stayMap.invalidateSize({ pan: false });") && appScript.includes("fitCountryBounds();"), "The expanded map should refit after resizing and allow a closer country view");
            assert(schema.includes("role in ('guest', 'host', 'admin')") && schema.includes("case when requested_role = 'host' then 'host' else 'guest' end"), "Only trusted database promotion can grant the admin profile role");
            assert(schema.includes("public.is_gather_admin()") && schema.includes("update_booking_admin") && schema.includes("if not public.is_gather_admin() then"), "Admin booking access should be checked by the database rather than only the interface");
            assert(schema.includes("or public.is_gather_admin()") && schema.includes("perform pg_advisory_xact_lock(hashtext(p_offering_id))"), "Administrators should manage all listings and booking conflict checks should be serialized");
            assert(appScript.includes('currentUser.role === "admin"') && appScript.includes('data-edit-booking="${escapeHtml(booking.id)}"') && appScript.includes('id="admin-booking-form"') && dataScript.includes('client.rpc("update_booking_admin"'), "The admin dashboard should edit bookings through the protected database function");
            assert(styles.includes(".booking-admin-edit") && styles.includes(".host-booking { align-items: start; flex-wrap: wrap;"), "Admin booking controls should remain usable on narrow screens");
            assert(styles.includes(".brand { display: inline-flex; align-items: center; gap: 10px;") && styles.includes("font-size: 26px; font-weight: 700;") && styles.includes(".brand-mark { width: 38px; height: 38px;"), "The Gather wordmark and mark should be more prominent in the header");
            assert(styles.includes("padding: 46px 0 42px;") && styles.includes("margin: 0 0 76px;") && styles.includes("padding: 0 0 76px;"), "Homepage sections should have clear, generous vertical separation");
            assert(styles.includes(".brand-mark { width: 32px; height: 32px; font-size: 24px; }") && styles.includes("margin-bottom: 50px;") && styles.includes("padding-bottom: 52px;"), "The larger brand and section spacing should adapt for mobile");
            assert(markup.includes("styles.css?v=20261103-spacing"), "The updated visual style should bypass stale browser CSS caches");
          });
          await testAsync("streams real AI replies through the authenticated Supabase proxy", async function () {
            const source = await (await fetch("./supabase-data.js")).text();
            const frame = document.createElement("iframe");
            frame.hidden = true;
            frame.srcdoc = "<!doctype html><html><body></body></html>";
            try {
              await new Promise((resolve) => {
                frame.onload = resolve;
                document.body.appendChild(frame);
              });
              const chatWindow = frame.contentWindow;
              chatWindow.GATHER_SUPABASE_CONFIG = { url: "https://gather.example", publishableKey: "public-key" };
              chatWindow.GatherBooking = { DEFAULT_OFFERINGS: [] };
              chatWindow.supabase = {
                createClient: () => ({ auth: { getSession: async () => ({ data: { session: { access_token: "session-token" } }, error: null }) } })
              };
              let requestUrl = "";
              let authorization = "";
              chatWindow.fetch = async (url, options) => {
                requestUrl = url;
                authorization = options.headers.Authorization;
                const encoder = new chatWindow.TextEncoder();
                const stream = new chatWindow.ReadableStream({
                  start(controller) {
                    controller.enqueue(encoder.encode('data: {"choices":[{"delta":{"content":"Hello "}}]}\n\n'));
                    controller.enqueue(encoder.encode('data: {"choices":[{"delta":{"content":"there!"}}]}\n\n'));
                    controller.enqueue(encoder.encode("data: [DONE]\n\n"));
                    controller.close();
                  }
                });
                return new chatWindow.Response(stream, { status: 200, headers: { "Content-Type": "text/event-stream" } });
              };
              chatWindow.eval(source);
              const tokens = [];
              const reply = await chatWindow.GatherSupabase.chatAssistant({
                messages: [{ role: "user", content: "Hello" }],
                listings: [],
                onToken: (token) => tokens.push(token)
              });
              assert(requestUrl === "https://gather.example/functions/v1/gather-chat" && authorization === "Bearer session-token", "The model request should use Gather’s authenticated server-side proxy");
              assert(reply === "Hello there!" && tokens.join("") === reply, "The browser should receive and render incremental model output");
            } finally {
              frame.remove();
            }
          });
          await testAsync("recommends real stays from destination, budget, and guest preferences", function () {
            const data = { offerings: api.DEFAULT_OFFERINGS, bookings: [], unavailableDates: [] };
            const result = window.GatherAssistant.respond("Find a quiet beach stay in Siargao for 2 guests under PHP 10000", data, {});
            assert(result.stays.length === 1 && result.stays[0].id === "isla-norte", "Should find the Siargao listing within the requested capacity and price");
            const checkin = api.addDays(api.toDateString(new Date()), 5);
            const checkout = api.addDays(checkin, 2);
            const unavailable = { offeringId: "isla-norte", checkin, checkout, status: "confirmed" };
            const unavailableResult = window.GatherAssistant.respond(`Find Siargao for 4 guests ${checkin} ${checkout}`, { ...data, unavailableDates: [unavailable] }, {});
            assert(unavailableResult.stays.length === 0 && unavailableResult.reply.includes("couldn’t find"), "Should exclude a real listing when the requested dates conflict with shared availability");
            const noMatch = window.GatherAssistant.respond("Find a Baguio stay for 8 guests", data, {});
            assert(noMatch.stays.length === 0 && /fewer guests/.test(noMatch.reply), "Should not recommend stays that cannot accommodate the requested group");
          });
          await testAsync("collects booking details in chat and prepares a pending request", function () {
            const data = { offerings: api.DEFAULT_OFFERINGS, bookings: [], unavailableDates: [] };
            const offering = data.offerings.find((item) => item.id === "isla-norte");
            const selected = window.GatherAssistant.startBooking(offering.id, data, { preferences: {} });
            assert(!selected.bookingReady && /check-in and check-out dates/i.test(selected.reply), "Should ask for dates before preparing a reservation");
            const checkin = api.addDays(api.toDateString(new Date()), 10);
            const checkout = api.addDays(checkin, 3);
            const withDates = window.GatherAssistant.respond(`${checkin} to ${checkout}`, data, selected.state);
            assert(!withDates.bookingReady && /how many guests/i.test(withDates.reply), "Should collect the guest count after the dates");
            const ready = window.GatherAssistant.respond("2", data, withDates.state);
            assert(ready.bookingReady && ready.bookingReady.offeringId === offering.id, "Should accept a bare guest count and prepare booking details for the selected stay");
            assert(ready.bookingReady.total === offering.price * 3 && ready.bookingReady.guests === 2, "The chat summary should calculate the stay total and guests");
            const sampleArrival = new Date();
            sampleArrival.setDate(sampleArrival.getDate() + 25);
            const sampleDeparture = new Date(sampleArrival);
            sampleDeparture.setDate(sampleDeparture.getDate() + 2);
            const month = (date) => new Intl.DateTimeFormat("en-US", { month: "long" }).format(date);
            const namedDates = window.GatherAssistant.extractDates(`${month(sampleArrival)} ${sampleArrival.getDate()} to ${month(sampleDeparture)} ${sampleDeparture.getDate()}`);
            assert(namedDates && namedDates.checkin === api.toDateString(sampleArrival) && namedDates.checkout === api.toDateString(sampleDeparture), "Should understand common month-and-day date phrasing");
          });
          await testAsync("guides a property host through an honest listing draft", function () {
            const data = { offerings: api.DEFAULT_OFFERINGS, bookings: [], unavailableDates: [] };
            let result = window.GatherAssistant.respond("I want to list my property", data, {});
            assert(result.state.listingStep === "name" && result.reply.includes("name"), "Should start by asking for the property name");
            result = window.GatherAssistant.respond("Amihan test cabin", data, result.state);
            result = window.GatherAssistant.respond("Baguio", data, result.state);
            result = window.GatherAssistant.respond("4 guests", data, result.state);
            result = window.GatherAssistant.respond("₱4,200 per night", data, result.state);
            result = window.GatherAssistant.respond("A quiet cabin with pine views and a small kitchen.", data, result.state);
            assert(result.listingDraft && result.listingDraft.name === "Amihan test cabin" && result.listingDraft.location === "Baguio City", "Should prepare the listing with information supplied in the conversation");
            assert(result.listingDraft.guests === 4 && result.listingDraft.price === 4200 && result.listingDraft.category === "Mountain hotels", "Should capture guest capacity, nightly PHP price, and inferred category");
          });
          await testAsync("renders booking and listing actions from the local assistant", async function () {
            const chatScript = await (await fetch("./chat.js")).text();
            const frame = document.createElement("iframe");
            frame.hidden = true;
            frame.srcdoc = '<form id="trip-chat-form"><input id="trip-chat-prompt"><button type="submit">Send</button></form><div id="trip-chat-messages"></div><button id="add-offering-button">Add listing</button>';
            try {
              await new Promise((resolve) => {
                frame.onload = resolve;
                document.body.appendChild(frame);
              });
              const chatWindow = frame.contentWindow;
              chatWindow.GatherBooking = api;
              chatWindow.GatherAssistant = window.GatherAssistant;
              chatWindow.GatherSupabase = {
                loadData: async () => ({ offerings: [{ id: "stay-1", name: "Siargao Stay", category: "Island stays", location: "Siargao, Philippines", description: "A sample beach stay", price: 2500, guests: 4, amenities: ["Beach access"], days: [0, 1, 2, 3, 4, 5, 6], minimumNights: 1 }], bookings: [], unavailableDates: [] }),
                chatAssistant: async ({ onToken }) => {
                  const reply = "Hello! I found a stay in Siargao you might like. [[GATHER_STAY:stay-1]]";
                  onToken(reply);
                  return reply;
                }
              };
              let listingOpenCount = 0;
              chatWindow.document.querySelector("#add-offering-button").addEventListener("click", () => { listingOpenCount += 1; });
              chatWindow.eval(chatScript);
              const input = chatWindow.document.querySelector("#trip-chat-prompt");
              const send = async (text) => {
                input.value = text;
                chatWindow.document.querySelector("#trip-chat-form").dispatchEvent(new chatWindow.Event("submit", { bubbles: true, cancelable: true }));
                for (let attempt = 0; attempt < 50 && chatWindow.document.querySelector(".trip-chat-message.assistant:last-child")?.textContent.includes("Gather is thinking"); attempt += 1) {
                  await new Promise((resolve) => setTimeout(resolve, 10));
                }
              };
              await send("Hello, find a beach stay in Siargao");
              const assistant = chatWindow.document.querySelector(".trip-chat-message.assistant");
              let actions = chatWindow.document.querySelectorAll(".trip-chat-actions button");
              assert(assistant.textContent.includes("Hello!") && assistant.textContent.includes("I found a stay") && actions.length === 1 && actions[0].dataset.bookOffering === "stay-1", `A natural language reply should render as chat and expose a verified Gather stay action (reply: ${assistant.textContent}; actions: ${actions.length})`);
              actions[0].click();
              await new Promise((resolve) => setTimeout(resolve, 0));
              assert(chatWindow.document.querySelector(".trip-chat-message.assistant:last-child").textContent.includes("check-in and check-out dates"), "Selecting a stay should continue the booking conversation in chat");
              const checkin = api.addDays(api.toDateString(new Date()), 10);
              const checkout = api.addDays(checkin, 2);
              await send(`${checkin} to ${checkout}`);
              await send("2 guests");
              const confirmButton = Array.from(chatWindow.document.querySelectorAll(".trip-chat-actions button")).find((button) => button.textContent.includes("Request to book"));
              assert(confirmButton, "A complete chat booking should offer an explicit request action");
              let confirmedDetails = null;
              chatWindow.GatherChatActions = {
                confirmBooking: async (details) => {
                  confirmedDetails = details;
                  return { offeringName: "Siargao Stay", nights: 2 };
                }
              };
              confirmButton.click();
              await new Promise((resolve) => setTimeout(resolve, 0));
              assert(confirmedDetails && confirmedDetails.offeringId === "stay-1" && confirmedDetails.checkin === checkin && confirmedDetails.guests === 2, "Confirmation should submit the exact details collected in chat");
              assert(chatWindow.document.querySelector(".trip-chat-message.assistant:last-child").textContent.includes("request") && chatWindow.document.querySelector(".trip-chat-message.assistant:last-child").textContent.includes("not sent to or confirmed"), "A successful request should not be described as a confirmed booking");
              await send("I want to list my property");
              await send("Island home");
              await send("Siargao");
              await send("5 guests");
              await send("₱4,200 per night");
              await send("A comfortable island retreat with a kitchen and ocean view.");
              const listingAction = Array.from(chatWindow.document.querySelectorAll(".trip-chat-actions button")).find((button) => button.textContent.includes("Review listing draft"));
              assert(listingAction, "Complete listing details should offer a draft review action");
              listingAction.click();
              const listing = chatWindow.GatherChatListingDraft;
              assert(listing && listing.name === "Island home" && listing.location === "Siargao" && listing.guests === 5 && listing.price === 4200, `The assistant should keep the details the host provided: ${JSON.stringify(listing)}`);
              assert(JSON.stringify(chatWindow.GatherChatListingDraft) === JSON.stringify(listing) && listingOpenCount === 1, "The listing draft action should open Gather’s editable listing form");
              chatWindow.dispatchEvent(new chatWindow.Event("gather-auth-changed"));
              assert(chatWindow.document.querySelectorAll(".trip-chat-message").length === 1, "Changing accounts should clear the prior conversation");
            } finally {
              frame.remove();
            }
          });
          await testAsync("serves all starter destination photos locally", async function () {
            const responses = await Promise.all(api.DEFAULT_OFFERINGS.map((offering) => fetch(offering.image)));
            assert(responses.every((response) => response.ok && response.headers.get("content-type").startsWith("image/jpeg")), "Every starter photo should load as a local JPEG");
          });
          await testAsync("includes a safe image migration for existing starter stays", async function () {
            const response = await fetch("./supabase-schema.sql");
            assert(response.ok, "The Supabase schema should be available");
            const schema = await response.text();
            assert(schema.includes("where id = 'isla-norte' and image = 'photo-1510414842594-a61c69b5ae57'"), "The schema should update only an unchanged default photo for existing stays");
            assert(schema.includes("where id = 'luntian-city-hotel' and image = 'assets/stays/makati-skyline.jpg'"), "The schema should update the Peninsula photo only when its destination photo is unchanged");
            assert(schema.includes("where id = 'vigan-heritage-inn' and image = 'assets/stays/vigan-calle-crisologo.jpg'"), "The schema should update the Hotel Luna photo only when its destination photo is unchanged");
            assert(schema.includes("where id = 'tagaytay-farmstay' and image = 'assets/stays/tagaytay-taal.jpg'"), "The schema should update the Taal Vista photo only when its destination photo is unchanged");
            assert(schema.includes("'assets/stays/siargao-cloud9.jpg'"), "The schema should seed the local destination photo");
            assert(api.DEFAULT_OFFERINGS.every((offering) => schema.includes(`('${offering.id}',`)), "The Supabase migration should seed every default listing");
          });
          await testAsync("allows browsing behind a clear booking disclaimer and gates booking on sign-in", async function () {
            const response = await fetch("./index.html");
            assert(response.ok, "The app page should be available");
            const markup = await response.text();
            assert(markup.includes('id="welcome-gate"') && markup.includes('aria-modal="true"') && markup.includes('id="welcome-dismiss"'), "The entry disclaimer should be dismissible");
            assert(!markup.includes('id="app-shell" inert') && !markup.includes("Presentation demo"), "The disclaimer should not block browsing or present the site as a demo");
            assert(markup.indexOf('id="welcome-gate"') < markup.indexOf('id="booking-modal"'), "The disclosure should appear before the sign-in dialog in the experience");
            assert(markup.includes("A booking request is not a confirmed reservation") && markup.includes("Do not submit payment details"), "The disclaimer should explain that a request is not a reservation and Gather does not take payment");
            const appScript = await (await fetch("./app.js")).text();
            const styles = await (await fetch("./styles.css")).text();
            assert(appScript.includes('classList.add("auth-modal")') && appScript.includes('[name="email"]'), "The auth dialog should be separately marked and focus its first field");
            assert(appScript.includes('openAuthModal("signup", "guest", { type: "booking", offeringId })') && appScript.includes('if (!currentUser || currentUser.isAnonymous)'), "An unauthenticated visitor should be prompted to create an account only on a booking request");
            assert(appScript.includes('if (window.sessionStorage.getItem("gather-booking-disclaimer-accepted") !== "true") showWelcomeGate()'), "The disclaimer should appear once per browser session");
            assert(styles.includes(".modal.auth-modal { width: min(100%, 640px)") && styles.includes(".auth-form input, .auth-form select { width: 100%; min-height: 52px") && styles.includes(".modal-backdrop.auth-backdrop"), "Sign-in should remain usable with accessible controls");
          });
          await testAsync("loads shared Philippine stays and public availability from Supabase", async function () {
            const shared = await window.GatherSupabase.loadData(null);
            assert(shared.offerings.length >= 8, "Supabase should return all starter stays, even when hosts have added more");
            assert(shared.offerings.some((offering) => offering.id === "isla-norte"), "Supabase should include the Siargao sample stay");
            assert(shared.offerings.filter((offering) => api.DEFAULT_OFFERINGS.some((sample) => sample.id === offering.id)).every((offering) => !/^photo-[\w-]+$/.test(offering.image || "")), "Legacy generic sample photos should resolve to the local destination photos");
            assert(shared.bookings.length === 0 && shared.favorites.length === 0, "Signed-out loading must not expose private bookings or favorites");
            assert(Array.isArray(shared.unavailableDates), "Public availability should be returned separately from private booking details");
          });
          await testAsync("uploads listing photos to the host-owned public storage path", async function () {
            const storage = window.GatherSupabase.client.storage;
            const originalFrom = storage.from;
            let uploaded = null;
            storage.from = function (bucket) {
              return {
                upload: async function (path, file, options) {
                  uploaded = { bucket, path, type: file.type, options };
                  return { data: { path }, error: null };
                },
                getPublicUrl: function (path) {
                  return { data: { publicUrl: `https://photos.example/${bucket}/${path}` } };
                }
              };
            };
            try {
              const file = new File(["photo"], "stay.png", { type: "image/png" });
              const result = await window.GatherSupabase.uploadListingImage(file, "host-123", "stay-demo");
              assert(uploaded.bucket === "listing-photos", "Should use the listing photo bucket");
              assert(uploaded.path.startsWith("host-123/stay-demo/") && uploaded.path.endsWith(".png"), "Photo path should be scoped to its host and listing");
              assert(uploaded.options.upsert === false && uploaded.type === "image/png", "Upload should preserve the image type without overwriting another image");
              assert(result.url.endsWith(uploaded.path), "Should return a public URL for the uploaded image");
              let invalidImageRejected = false;
              try {
                await window.GatherSupabase.uploadListingImage(new File(["image"], "stay.svg", { type: "image/svg+xml" }), "host-123", "stay-demo");
              } catch (error) {
                invalidImageRejected = error.message.includes("JPG, PNG, or WebP");
              }
              assert(invalidImageRejected, "Should reject unsupported image formats");
            } finally {
              storage.from = originalFrom;
            }
          });
          await testAsync("sends booking details to EmailJS with configured credentials", async function () {
            const previousConfig = window.GATHER_EMAIL_CONFIG;
            const previousFetch = window.fetch;
            let requestUrl = "";
            let requestBody = null;
            window.GATHER_EMAIL_CONFIG = { serviceId: "service-test", templateId: "template-test", publicKey: "public-test" };
            window.fetch = async function (url, options) {
              requestUrl = url;
              requestBody = JSON.parse(options.body);
              return { ok: true };
            };
            try {
              const sent = await window.GatherEmailNotifications.sendBookingNotification({
                id: "trip-test", name: "Jamie Lee", email: "jamie@example.com",
                offeringName: "Isla Norte", location: "Siargao, Philippines",
                checkin: "2030-01-07", checkout: "2030-01-10", nights: 3,
                guests: 2, price: 6800, total: 20400, notes: "First visit"
              });
              assert(sent, "Notification should report success");
              assert(requestUrl === "https://api.emailjs.com/api/v1.0/email/send", "Should use the EmailJS send endpoint");
              assert(requestBody.service_id === "service-test" && requestBody.template_id === "template-test" && requestBody.user_id === "public-test", "Should send configured EmailJS identifiers");
              assert(requestBody.template_params.booking_id === "trip-test" && requestBody.template_params.guest_email === "jamie@example.com", "Should include booking and guest contact details");
              assert(requestBody.template_params.total.includes("20,400"), "Should format the total in Philippine pesos");
            } finally {
              window.GATHER_EMAIL_CONFIG = previousConfig;
              window.fetch = previousFetch;
            }
          });
          await testAsync("skips notifications until EmailJS is configured", async function () {
            const previousConfig = window.GATHER_EMAIL_CONFIG;
            const previousFetch = window.fetch;
            let requested = false;
            window.GATHER_EMAIL_CONFIG = {};
            window.fetch = async function () {
              requested = true;
              return { ok: true };
            };
            try {
              const sent = await window.GatherEmailNotifications.sendBookingNotification({});
              assert(sent === false && !requested, "An incomplete setup should not send a request");
            } finally {
              window.GATHER_EMAIL_CONFIG = previousConfig;
              window.fetch = previousFetch;
            }
          });
          await testAsync("reports EmailJS delivery errors without hiding them", async function () {
            const previousConfig = window.GATHER_EMAIL_CONFIG;
            const previousFetch = window.fetch;
            window.GATHER_EMAIL_CONFIG = { serviceId: "service-test", templateId: "template-test", publicKey: "public-test" };
            window.fetch = async function () {
              return { ok: false, status: 429, text: async function () { return "Rate limit exceeded"; } };
            };
            try {
              let caught = "";
              try {
                await window.GatherEmailNotifications.sendBookingNotification({
                  checkin: "2030-01-07", checkout: "2030-01-10"
                });
              } catch (error) {
                caught = error.message;
              }
              assert(caught.includes("429") && caught.includes("Rate limit exceeded"), "Failed responses should expose the EmailJS error");
            } finally {
              window.GATHER_EMAIL_CONFIG = previousConfig;
              window.fetch = previousFetch;
            }
          });
          await testAsync("loads a valid Philippines border outline", async function () {
            const response = await fetch("./philippines-border.geojson");
            assert(response.ok, "Boundary asset should be served successfully");
            const data = await response.json();
            const geometry = data.features[0].geometry;
            assert(geometry.type === "MultiPolygon" && geometry.coordinates.length > 80, "The country boundary should include the Philippines' major islands");
            let vertices = 0;
            geometry.coordinates.forEach((polygon) => polygon.forEach((ring) => {
              assert(ring.length >= 4, "Every boundary ring needs at least four coordinates");
              const first = ring[0];
              const last = ring[ring.length - 1];
              assert(first[0] === last[0] && first[1] === last[1], "Every boundary ring should be closed");
              ring.forEach((point) => {
                assert(Number.isFinite(point[0]) && Number.isFinite(point[1]), "Boundary coordinates should be numeric");
                assert(point[0] >= 115 && point[0] <= 128 && point[1] >= 4 && point[1] <= 22, "Boundary coordinates should be within the Philippines map bounds");
                vertices += 1;
              });
            }));
            assert(vertices > 500, "The country outline should have enough points to be recognizable");
          });
          document.getElementById("summary").textContent = `${passed} passed · ${failed} failed`;
          document.title = `${failed ? "FAIL" : "PASS"} — Gather stay booking tests`;
        }
        finish();
      })();
    </script>
